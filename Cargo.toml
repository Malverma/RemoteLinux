[workspace]
resolver = "2"
members = ["crates/rl-common", "crates/rl-host", "crates/rl-client", "crates/rl-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
spake2 = "0.4"
hmac = "0.12"
rand = "0.8"
bytes = "1"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }

[profile.release]
debug = 1
